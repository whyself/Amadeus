# Copy to amadeus.local.yml (gitignored), then set your own credentials.
username: amadeus
password: CHANGE-ME
host: 127.0.0.1
port: 3080
sessionHours: 12
# Default home: <project>/.amadeus/dsh-home; generated editor workspaces: <home>/editor/workspaces.
# home: /srv/amadeus/data
# Optional default workspace for new sessions (must already exist):
# workspace: /srv/amadeus-workspace
maxUploadBytes: 1073741824
# Maximum complete-file read for native PDF/file previews (256 MiB); restart after changing.
maxPreviewBytes: 268435456
# Embedded code-server (Docker configures these paths automatically).
# editor:
#   upstream: http://127.0.0.1:8080
#   bridgeDir: /data/editor/bridge

# Official DSH browser use (experimental; enabled by default).
# Each live Session launches its own Chromium; startup installs the pinned runtime.
# browserUse:
#   enabled: true
#   mode: launch
#   headless: true
#   # executablePath: /usr/bin/chromium
#   # toolCallTimeoutMs: 60000
# Attach to an existing server-side Chromium (one active Session owns the connection):
# browserUse:
#   enabled: true
#   mode: attach
#   endpoint: http://127.0.0.1:9222
# This does not connect the existing sidebar iframe to the AI browser.
